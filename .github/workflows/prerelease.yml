name: Pre-release

# Fires when a release-candidate tag like v1.2.0-rc.1 gets pushed, from any
# branch. This is how you try out a specific commit as a near-final build
# before committing to a real vX.Y.Z release.
on:
  push:
    tags:
      - 'v*.*.*-rc.*'

permissions:
  contents: write

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Shell syntax check
        run: bash -n delete.sh

      - name: JS syntax check
        run: node --check delete.js

      - name: Create GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG (pre-release)" \
            --prerelease \
            --generate-notes \
            delete.sh delete.js
