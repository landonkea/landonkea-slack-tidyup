name: Release

# Fires when a stable tag like v1.2.0 gets pushed. Only creates a real
# GitHub Release if that tag actually sits on main, a vX.Y.Z tag pushed
# from some other branch gets rejected rather than silently published.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject release-candidate tags
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" == *-rc.* ]]; then
            echo "'$TAG' is a pre-release tag, not a stable one. The prerelease workflow handles those. Stopping."
            exit 1
          fi

      - name: Confirm this tag is on main
        run: |
          git fetch origin main --depth=1 2>/dev/null || git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF#refs/tags/} points at a commit that isn't on main."
            echo "Stable release tags only get published from main. Refusing to publish."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Shell syntax check
        run: bash -n delete.sh

      - name: JS syntax check
        run: node --check delete.js

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            delete.sh delete.js
